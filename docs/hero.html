<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Wishbone hero</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Figtree:wght@500;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;overflow:hidden}
body{background:#E2A93B;font-family:'Figtree',sans-serif;color:#2B2B33;position:relative}
.dots{position:absolute;inset:0;background:radial-gradient(#C8921F 2px,transparent 2.5px) 0 0/34px 34px;opacity:.55}
.blob{position:absolute;right:-12vw;top:-30vh;width:75vw;height:75vw;border-radius:50%;background:#F4F2EE}
.copy{position:absolute;left:6vw;top:50%;transform:translateY(-50%);width:36vw}
.tag{display:inline-block;background:#2B2B33;color:#F4F2EE;font-weight:700;font-size:1.3vw;padding:.5vw 1.4vw;border-radius:99px;margin-bottom:2.4vw}
h1{font-family:'Fraunces',serif;font-weight:700;font-size:6.6vw;line-height:.98;letter-spacing:-.04em;margin:0 0 2.2vw}
p{font-size:1.75vw;line-height:1.4;font-weight:500;margin:0;max-width:30vw}
.desk{position:absolute;right:5vw;top:13vh;width:52vw;border:.28vw solid #2B2B33;border-radius:1.2vw;overflow:hidden;background:#fff;box-shadow:.9vw .9vw 0 #2B2B33;transform:rotate(2.4deg)}
.bar{height:2.4vw;background:#E6E3DD;border-bottom:.2vw solid #2B2B33;display:flex;align-items:center;gap:.5vw;padding-left:1vw}
.bar i{width:.8vw;height:.8vw;border-radius:50%;background:#C8C6C0;border:.12vw solid #2B2B33}
.desk img{display:block;width:100%}
.phone{position:absolute;right:50vw;bottom:-9vh;width:15vw;border:.28vw solid #2B2B33;border-radius:2.2vw;overflow:hidden;box-shadow:.8vw .8vw 0 #2B2B33;transform:rotate(-5deg);background:#fff;display:none}
.ph2{position:absolute;right:3vw;bottom:-14vh;width:17vw;border:.3vw solid #2B2B33;border-radius:2.4vw;overflow:hidden;box-shadow:.8vw .8vw 0 #2B2B33;transform:rotate(-4deg);background:#fff}
.ph2 img{display:block;width:100%}
</style></head><body>
<div class="dots"></div><div class="blob"></div>
<div class="copy"><span class="tag">Free · Private · Works offline</span><h1>Wish it.<br>Pin it.<br>Get it.</h1><p>Your own wishlist on a wall of photos, with a running total in pesos.</p></div>
<div class="desk"><div class="bar"><i></i><i></i><i></i></div><img src="screenshots/app-desktop.png" alt=""></div>
<div class="ph2"><img src="screenshots/app-phone.png" alt=""></div>
</body></html>
